nodeLinker: hoisted
# Owner-approved exact-version exceptions for local test builds (2026-09-29).
# Keep the default release-age policy for all other dependencies.
minimumReleaseAgeExclude:
  - expo@57.0.27
  - expo-camera@57.0.6
  - expo-constants@57.0.21
  - expo-router@57.0.25
  - expo-linking@57.0.12
  - expo-notifications@57.0.22
  - expo-sqlite@57.0.4
  - expo-task-manager@57.0.21
  - expo-modules-core@57.0.21
  - '@expo/ui@57.0.22'
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-modules-autolinking@57.0.14
packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  workerd: true
# Narrow fixes for the Expo/native build toolchain. xcode uses uuid.v4() through
# CommonJS; uuid 11 retains that interface, while later majors remove it.
overrides:
  'brace-expansion@5.0.9': 5.0.12
  'xcode>uuid': 11.1.1
