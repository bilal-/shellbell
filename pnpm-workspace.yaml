nodeLinker: hoisted
# Exact release-age exceptions for reviewed Expo SDK 57 patch dependencies.
# Keep the default release-age policy for all other dependencies.
minimumReleaseAgeExclude:
  - expo@57.0.27 || 57.0.28 || 57.0.31 || 57.0.32
  - expo-camera@57.0.6
  - expo-constants@57.0.21 || 57.0.23
  - expo-router@57.0.25 || 57.0.26 || 57.0.29 || 57.0.30
  - expo-linking@57.0.12
  - expo-notifications@57.0.22 || 57.0.24 || 57.0.25
  - expo-sqlite@57.0.4
  - expo-task-manager@57.0.21 || 57.0.22
  - expo-modules-core@57.0.21 || 57.0.22 || 57.0.24 || 57.0.25
  - '@expo/ui@57.0.22 || 57.0.23 || 57.0.26'
  - '@expo/cli@57.0.28 || 57.0.29 || 57.0.32 || 57.0.33'
  - '@expo/config-plugins@57.0.10 || 57.0.11 || 57.0.12'
  - '@expo/config@57.0.10 || 57.0.11'
  - '@expo/image-utils@0.11.6 || 0.11.7'
  - '@expo/metro-config@57.0.13 || 57.0.14'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17 || 57.0.18 || 57.0.20'
  - '@expo/require-utils@57.0.6 || 57.0.7'
  - '@expo/router-server@57.0.12 || 57.0.14 || 57.0.15'
  - babel-preset-expo@57.0.14 || 57.0.15 || 57.0.17
  - expo-asset@57.0.19 || 57.0.21
  - expo-modules-autolinking@57.0.14 || 57.0.15 || 57.0.17
  - '@expo/fingerprint@0.20.14 || 0.20.15'
  - '@expo/inline-modules@0.1.8 || 0.1.9'
  - '@expo/local-build-cache-provider@57.0.9 || 57.0.10'
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20 || 57.0.21
  - expo-dev-launcher@57.0.21 || 57.0.22
  - expo-dev-menu@57.0.20 || 57.0.21
  - expo-modules-jsi@57.1.2 || 57.1.3
  - expo-splash-screen@57.0.10 || 57.0.11
  - expo-network@57.0.3
  - '@expo/env@2.4.4'
  - '@expo/log-box@57.0.5'
  - '@expo/metro-runtime@57.0.18'
  - '@expo/plist@0.8.2'
  - '@expo/schema-utils@57.0.3'
  - expo-build-properties@57.0.23
  - expo-glass-effect@57.0.5
packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  workerd: true
# Narrow fixes for the Expo/native build toolchain. xcode uses uuid.v4() through
# CommonJS; uuid 11 retains that interface, while later majors remove it.
overrides:
  # Patch the toolchains' older SVG renderer (GHSA-wq5f-xc86-pv6w).
  'sharp@>=0.35.2 <0.35.5': 0.35.5
  'brace-expansion@5.0.9': 5.0.12
  'xcode>uuid': 11.1.1
