nodeLinker: hoisted
# Owner-approved exact-version exceptions for local test builds (2026-09-29), extended
# to the SDK 57 patch releases the owner approved on 2026-10-12 so expo-doctor passes.
# Keep the default release-age policy for all other dependencies.
minimumReleaseAgeExclude:
  - expo@57.0.27 || 57.0.28
  - expo-camera@57.0.6
  - expo-constants@57.0.21
  - expo-router@57.0.25 || 57.0.26
  - expo-linking@57.0.12
  - expo-notifications@57.0.22
  - expo-sqlite@57.0.4
  - expo-task-manager@57.0.21
  - expo-modules-core@57.0.21 || 57.0.22
  - '@expo/ui@57.0.22 || 57.0.23'
  - '@expo/cli@57.0.28 || 57.0.29'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17 || 57.0.18'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14 || 57.0.15
  - expo-asset@57.0.19
  - expo-modules-autolinking@57.0.14 || 57.0.15
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-modules-jsi@57.1.2
  - expo-splash-screen@57.0.10
packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  workerd: true
# Narrow fixes for the Expo/native build toolchain. xcode uses uuid.v4() through
# CommonJS; uuid 11 retains that interface, while later majors remove it.
overrides:
  # Patch the toolchains' older SVG renderer (GHSA-wq5f-xc86-pv6w).
  'sharp@>=0.35.2 <0.35.5': 0.35.5
  'brace-expansion@5.0.9': 5.0.12
  'xcode>uuid': 11.1.1
