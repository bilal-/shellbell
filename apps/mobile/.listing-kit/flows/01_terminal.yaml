appId: sh.bilal.shellbell
---
- pressKey: Home
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Agree|.*Studio Mac.*"
    timeout: 30000
- tapOn:
    text: Agree
    optional: true
- extendedWaitUntil:
    visible: ".*Studio Mac.*"
    timeout: 30000
- tapOn: ".*Studio Mac.*"
- assertVisible: ".*Development server.*"
- tapOn: ".*Build and test.*"
- extendedWaitUntil:
    visible: Session actions
    timeout: 30000
- assertVisible: "Build and test.*connection: Direct"
- waitForAnimationToEnd
