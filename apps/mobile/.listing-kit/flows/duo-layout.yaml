appId: sh.bilal.shellbell
---
- runFlow: 03_terminal.yaml
- tapOn: "Command draft.*"
- inputText: git status
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: ".*git status.*"
    timeout: 15000
- assertNotVisible: "Connection: Direct"
- setOrientation: PORTRAIT
- assertVisible: ".*git status.*"
