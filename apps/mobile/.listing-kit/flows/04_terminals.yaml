appId: sh.bilal.shellbell
---
- runFlow: _open.yaml
- tapOn: "Terminals"
- extendedWaitUntil:
    visible: ".*Ghostty.*"
    timeout: 15000
- swipe:
    start: 50%, 45%
    end: 50%, 85%
    duration: 600
- extendedWaitUntil:
    visible: ".*Add rate limiting to the API.*"
    timeout: 5000
- waitForAnimationToEnd
# Herdr alone fills the screen above the filters; scroll just until an iTerm2 row shows, so
# the end of Herdr, tmux and iTerm2 are all on screen.
- scrollUntilVisible:
    element: "mobile.*Review the release notes.*"
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
