appId: sh.bilal.shellbell
---
- pressKey: Home
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Agree|.*Studio Mac.*"
    timeout: 30000
- tapOn:
    text: Agree
    optional: true
- extendedWaitUntil:
    visible: ".*Studio Mac.*"
    timeout: 30000
- tapOn: ".*Studio Mac.*"
- assertVisible: ".*Build and test.*"
- assertVisible: ".*Development server.*"
- assertVisible: ".*Review the changes.*"
- assertVisible: ".*blocked.*"
- waitForAnimationToEnd
