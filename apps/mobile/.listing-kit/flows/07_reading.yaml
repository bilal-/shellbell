appId: sh.bilal.shellbell
---
- runFlow: _open.yaml
- tapOn: "Terminals"
# Show only tmux terminals, so "build" sits near the top on every screen size.
- tapOn:
    text: "Show only tmux"
    index: 0
- extendedWaitUntil:
    visible: "build.*finished.*"
    timeout: 15000
- tapOn: "build.*finished.*"
- extendedWaitUntil:
    visible: Session actions
    timeout: 30000
- tapOn: Session actions
- tapOn: Reading view
- extendedWaitUntil:
    visible: ".*Build complete in 1.4s.*"
    timeout: 30000
- waitForAnimationToEnd
