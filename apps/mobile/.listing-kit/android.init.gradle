// Keep offline demo APKs separate from normal local-test artifacts.
gradle.beforeProject { app ->
    if (app.path != ':app') return
    app.afterEvaluate {
        if (gradle.startParameter.taskNames.any { !it.endsWith('assembleListingCapture') }) {
            throw new GradleException('Listing capture only supports assembleListingCapture')
        }
        def android = app.extensions.findByName('android')
        if (android == null) return
        android.buildTypes.create('listingCapture') {
            initWith android.buildTypes.release
            signingConfig android.signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            versionNameSuffix '-listing-capture'
        }
        app.extensions.getByName('react').entryFile.set(new File(app.projectDir, '../../.listing-kit/entry.ts'))
    }
}
