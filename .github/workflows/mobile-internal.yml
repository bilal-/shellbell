name: mobile-internal
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-internal
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ vars.SHELLBELL_ENABLE_MOBILE_RELEASE == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.source.outputs.release }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      candidate_tag: ${{ steps.source.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm check:release-tooling
      - id: source
        run: node scripts/mobile-release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  android:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' }}
    environment: mobile-internal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.deliver.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Reserve disk space for the Android native build
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h "$GITHUB_WORKSPACE"
          # These preinstalled tools are unused by this disposable Android job.
          # Preserve the Android SDK/NDK, Java, Node and Ruby toolchains.
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images
          available_kib="$(df --output=avail "$GITHUB_WORKSPACE" | tail -n 1)"
          if (( available_kib < 24 * 1024 * 1024 )); then
            echo 'Android native builds require at least 24 GiB free before dependency installation.' >&2
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install pinned bundletool
        run: |
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const actual=crypto.createHash("sha256").update(fs.readFileSync(process.env.RUNNER_TEMP+"/bundletool.jar")).digest("hex");if(actual!==process.env.BUNDLETOOL_SHA256)throw Error("bundletool checksum mismatch")'
        env:
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
      - name: Prepare private Android signing and upload inputs
        run: node scripts/mobile-release-credentials.mjs prepare android
        env:
          SHELLBELL_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHELLBELL_ANDROID_KEYSTORE_BASE64 }}
          SHELLBELL_ANDROID_SIGNING_JSON: ${{ secrets.SHELLBELL_ANDROID_SIGNING_JSON }}
          SHELLBELL_PLAY_CREDENTIALS_JSON: ${{ secrets.SHELLBELL_PLAY_CREDENTIALS_JSON }}
          SHELLBELL_GOOGLE_SERVICES_JSON: ${{ secrets.SHELLBELL_GOOGLE_SERVICES_JSON }}
      - name: Build and verify Google Play internal delivery
        id: deliver
        working-directory: apps/mobile
        run: bundle exec fastlane android ci_internal
        env:
          SHELLBELL_CONFIRM_UPLOAD: internal
          SHELLBELL_BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          SHELLBELL_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SHELLBELL_RELEASE_RECEIPT: ${{ github.workspace }}/android-release-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-android-${{ needs.prepare.outputs.candidate_tag }}
          path: android-release-receipt.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ needs.prepare.outputs.candidate_tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android-release-receipt.json
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/mapping/release/
            apps/mobile/android/app/build/generated/sourcemaps/react/release/
      - name: Remove private Android inputs
        if: ${{ always() }}
        run: node scripts/mobile-release-credentials.mjs cleanup android
  ios:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' }}
    environment: mobile-internal
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      build_number: ${{ steps.deliver.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare temporary signing keychain and notification profiles
        run: node scripts/mobile-release-credentials.mjs prepare ios
        env:
          SHELLBELL_IOS_CERTIFICATE_BASE64: ${{ secrets.SHELLBELL_IOS_CERTIFICATE_BASE64 }}
          SHELLBELL_IOS_CERTIFICATE_PASSWORD: ${{ secrets.SHELLBELL_IOS_CERTIFICATE_PASSWORD }}
          SHELLBELL_IOS_PROFILE_BASE64: ${{ secrets.SHELLBELL_IOS_PROFILE_BASE64 }}
          SHELLBELL_IOS_NOTIFICATION_PROFILE_BASE64: ${{ secrets.SHELLBELL_IOS_NOTIFICATION_PROFILE_BASE64 }}
          SHELLBELL_ASC_API_KEY_JSON: ${{ secrets.SHELLBELL_ASC_API_KEY_JSON }}
          SHELLBELL_APPLE_TEAM_ID: ${{ vars.SHELLBELL_APPLE_TEAM_ID }}
          SHELLBELL_IOS_PROFILE: ${{ vars.SHELLBELL_IOS_PROFILE }}
          SHELLBELL_IOS_NOTIFICATION_PROFILE: ${{ vars.SHELLBELL_IOS_NOTIFICATION_PROFILE }}
      - name: Build and verify internal TestFlight delivery
        id: deliver
        working-directory: apps/mobile
        run: bundle exec fastlane ios ci_internal
        env:
          SHELLBELL_CONFIRM_UPLOAD: internal
          SHELLBELL_APPLE_TEAM_ID: ${{ vars.SHELLBELL_APPLE_TEAM_ID }}
          SHELLBELL_IOS_PROFILE: ${{ vars.SHELLBELL_IOS_PROFILE }}
          SHELLBELL_IOS_NOTIFICATION_PROFILE: ${{ vars.SHELLBELL_IOS_NOTIFICATION_PROFILE }}
          SHELLBELL_ASC_APP_ID: ${{ vars.SHELLBELL_ASC_APP_ID }}
          SHELLBELL_TESTFLIGHT_GROUP: ${{ vars.SHELLBELL_TESTFLIGHT_GROUP }}
          SHELLBELL_IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.SHELLBELL_IOS_USES_NON_EXEMPT_ENCRYPTION }}
          SHELLBELL_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SHELLBELL_RELEASE_RECEIPT: ${{ github.workspace }}/ios-release-receipt.json
          SOURCEMAP_FILE: ${{ github.workspace }}/apps/mobile/output/ios/main.jsbundle.map
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-ios-${{ needs.prepare.outputs.candidate_tag }}
          path: ios-release-receipt.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-${{ needs.prepare.outputs.candidate_tag }}
          path: apps/mobile/output/ios/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed iOS archive logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mobile/output/ios/build-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing keychain, profiles and API key
        if: ${{ always() }}
        run: node scripts/mobile-release-credentials.mjs cleanup ios
  tag:
    needs: [prepare, android, ios]
    if: ${{ needs.prepare.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: receipt-*-${{ needs.prepare.outputs.candidate_tag }}
          merge-multiple: true
      - name: Tag the source only after both store assignments are verified
        run: node scripts/mobile-release.mjs tag android-release-receipt.json ios-release-receipt.json
        env:
          GH_TOKEN: ${{ github.token }}
          SHELLBELL_CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
